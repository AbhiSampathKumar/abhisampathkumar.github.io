<!-- Custom head additions. AcademicPages includes this file inside <head> after
     main.css, so anything here overrides the theme's default styles. -->

<!-- Default the site to dark mode. Runs before first paint, so there's no
     white flash. The theme's toggle button (top right) still works and its
     choice is remembered in localStorage. -->
<script>document.documentElement.setAttribute("data-theme", "dark");</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<style>
  /* ---- True black palette ----
     The theme's own dark mode is a mid grey (#474747). These override its
     CSS variables to black. Same selector as the theme uses, declared later,
     so these win. Everything below reads from these variables, which means
     the light theme still works if a visitor flips the toggle. ---- */
  html[data-theme="dark"] {
    --global-bg-color: #000000;
    --global-footer-bg-color: #000000;
    --global-border-color: #262626;
    --global-dark-border-color: #333333;
    --global-code-background-color: #111111;
    --global-code-text-color: #e8e8e8;
    --global-fig-caption-color: #a8a8a8;
    --global-link-color: #62c7e3;
    --global-link-color-hover: #9adcef;
    --global-link-color-visited: #8ab6c4;
    --global-masthead-link-color: #ffffff;
    --global-masthead-link-color-hover: #62c7e3;
    --global-text-color: #ffffff;
    --global-text-color-light: #b5b5b5;
    --global-thead-color: #1a1a1a;
  }

  /* Belt and braces: some elements set their background from Sass rather than
     from the variables above. */
  html[data-theme="dark"],
  html[data-theme="dark"] body,
  html[data-theme="dark"] #main,
  html[data-theme="dark"] .page,
  html[data-theme="dark"] .masthead,
  html[data-theme="dark"] .page__footer,
  html[data-theme="dark"] .greedy-nav,
  html[data-theme="dark"] .greedy-nav .hidden-links {
    background-color: #000000;
  }

  /* ---- Typography: serif headings, quiet sans body ---- */
  body,
  .page__content,
  .sidebar {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.65;
    color: var(--global-text-color);
  }

  h1, h2, h3, h4, h5, h6,
  .page__title,
  .archive__item-title,
  .masthead__inner-wrap .site-title {
    font-family: "Newsreader", Georgia, serif;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--global-text-color);
  }

  .page__title {
    font-size: 2.2em;
    margin-bottom: 0.4em;
  }

  /* Section headings get a hairline rule, like a printed page */
  .page__content h2 {
    font-size: 1.45em;
    margin-top: 2.2em;
    padding-bottom: 0.25em;
    border-bottom: 1px solid var(--global-border-color);
  }

  .page__content h3 {
    font-size: 1.15em;
    margin-top: 1.8em;
  }

  /* ---- Links: understated, underline on hover ---- */
  a,
  .page__content a {
    color: var(--global-link-color);
    text-decoration: none;
    border-bottom: 1px solid rgba(98, 199, 227, 0.3);
  }

  a:hover,
  .page__content a:hover {
    color: var(--global-link-color-hover);
    border-bottom-color: currentColor;
    text-decoration: none;
  }

  /* Don't underline structural links */
  .masthead a,
  .site-title,
  .author__urls a,
  .page__footer a,
  .toc a,
  .pagination a {
    border-bottom: none;
  }

  /* ---- Header ---- */
  .masthead {
    border-bottom: 1px solid var(--global-border-color);
  }

  .masthead__inner-wrap {
    padding: 0.9em 1em;
  }

  .greedy-nav .visible-links a::before {
    background: var(--global-link-color);
  }

  /* ---- Sidebar / author profile ----
     The theme makes the sidebar sticky, so on a long page the photo and name ride
     up over the masthead and cover the site title. Pin it in the normal flow and
     keep the header above it. ---- */
  .sidebar,
  .sidebar.sticky {
    position: relative;
    top: auto;
    overflow: visible;
    height: auto;
    z-index: 0;
  }

  /* Leave the theme's own fixed positioning alone -- overriding it was what
     trapped the mobile menu behind the header. Just make sure the header sits
     above the page and never clips its own dropdown. */
  .masthead {
    z-index: 100;
    background: var(--global-bg-color);
    overflow: visible;
  }

  /* The collapsed nav panel, on screens wide enough to use it. */
  .greedy-nav {
    overflow: visible;
  }

  .greedy-nav .hidden-links {
    z-index: 9999;
    background: var(--global-bg-color);
    border: 1px solid var(--global-border-color);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
  }

  .greedy-nav .hidden-links a {
    color: var(--global-text-color);
  }

  /* ---- Phones: no dropdown at all ----
     The theme's greedy nav moves items it thinks won't fit into a toggled panel,
     which on a phone ends up painted behind the page. Instead, show every link
     inline and let them wrap onto a second row. The toggle button is hidden
     because there is nothing left to toggle. ---- */
  @media (max-width: 700px) {
    .greedy-nav button {
      display: none !important;
    }

    .greedy-nav .visible-links,
    .greedy-nav .hidden-links {
      display: flex !important;
      flex-wrap: wrap;
      align-items: center;
      position: static !important;
      margin: 0;
      padding: 0;
      border: none !important;
      box-shadow: none !important;
      background: transparent !important;
      visibility: visible !important;
      opacity: 1 !important;
      max-height: none !important;
      overflow: visible !important;
    }

    /* the little pointer triangles belong to the dropdown; not needed inline */
    .greedy-nav .hidden-links::before,
    .greedy-nav .hidden-links::after {
      display: none !important;
    }

    .greedy-nav .visible-links li,
    .greedy-nav .hidden-links li {
      display: block !important;
      border-bottom: none !important;
    }

    .greedy-nav .visible-links a,
    .greedy-nav .hidden-links a {
      margin: 0;
      padding: 0.3rem 0.7rem 0.3rem 0;
      font-size: 0.95em;
    }

    /* the name gets its own line, the section links sit under it */
    .masthead__menu-item--lg {
      flex-basis: 100%;
      padding-right: 0;
    }
  }

  .author__avatar img {
    border-radius: 4px;
    border: 1px solid var(--global-border-color);
    max-width: 180px;
  }

  .author__name {
    font-family: "Newsreader", Georgia, serif;
    font-size: 1.15em;
  }

  .author__bio {
    font-size: 0.85em;
    line-height: 1.5;
    color: var(--global-text-color-light);
  }

  .author__urls-wrapper li {
    font-size: 0.85em;
  }

  /* ---- Tagline: the lead line on the home page, in place of an h1 ----
     The two-part selector is deliberate. The theme sets font-size 1em on
     .page__content p, which is more specific than .tagline alone and would
     otherwise win no matter what size is set here. ---- */
  .page__content p.tagline,
  .tagline {
    font-family: "Newsreader", Georgia, serif;
    font-style: italic;
    font-size: 2em;        /* ~32px against the 16px body */
    line-height: 1.2;
    color: var(--global-text-color);
    margin: 0.15em 0 1.1em;
    padding-left: 0;
    border-left: none;
  }

  /* ==========================================================================
     MICROSCOPY BANDS
     Two ways in, styled identically:
       1. Pages with a title use the theme's hero -- set header.overlay_image
          in the front matter and the title renders over the image.
       2. The home page has no title, so it uses <div class="band"> in the
          markdown instead, with the file passed via the --band-img variable.
     Both fade to black at the bottom and at the left/right edges, so a
     black-background micrograph dissolves into the page rather than sitting
     in a rectangle. Drop the fade by deleting the mask-image lines.
     ========================================================================== */

  .band,
  .page__hero--overlay {
    min-height: 0;
    padding: 0;
    margin: 0 0 1.8em;
    background-color: #000;
    /* `contain`, not `cover`: the band images are montages of whole specimens,
       so nothing may be cropped. Any leftover space is black, which is the
       page colour anyway, so the letterboxing is invisible. */
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    /* fade out at the bottom and both sides */
    -webkit-mask-image:
      linear-gradient(to bottom, #000 45%, transparent 100%),
      linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to bottom, #000 45%, transparent 100%),
      linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%);
    mask-composite: intersect;
  }

  .band {
    background-image: var(--band-img);
    /* height follows the column width at the montage's own aspect ratio,
       so the specimens are never squeezed or clipped */
    aspect-ratio: 1800 / 560;
  }

  /* Divider version between sections */
  .band--strip {
    margin: 2.6em 0 2.2em;
  }

  /* ---- Specimen down the right margin ----
     Fixed to the viewport so it stays put while the page scrolls, sitting
     behind the text and fading out towards the content on the left and at
     the top and bottom. Purely decorative: pointer-events off, and hidden
     on narrower screens where there is no spare margin. ---- */
  .side-specimen {
    position: fixed;
    top: 0;
    right: 0;
    width: 20vw;
    max-width: 330px;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
    opacity: 0.62;
    background-image: var(--side-img);
    background-repeat: no-repeat;
    background-size: contain;
    background-position: right center;
    -webkit-mask-image:
      linear-gradient(to left, #000 55%, transparent 100%),
      linear-gradient(to bottom, transparent 0, #000 18%, #000 82%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to left, #000 55%, transparent 100%),
      linear-gradient(to bottom, transparent 0, #000 18%, #000 82%, transparent 100%);
    mask-composite: intersect;
  }

  /* ---- Faded backdrops ----
     Specimens sitting behind the page, fixed while you scroll, at low opacity
     so body text stays readable. Each fades to nothing at its own edges, so
     several can share a page without showing seams.

     Usage: any number per page. Give each a position modifier class and pass
     the image file through the --backdrop-img variable; see the top of
     research.md for a working example.

     Positions: --tr top right, --br bottom right, --bl bottom left,
                --tl top left, --c centred and larger.
     `opacity` is the dial to turn; past ~0.25 text starts to suffer. ---- */
  .backdrop {
    position: fixed;
    z-index: 0;
    pointer-events: none;
    opacity: 0.26;          /* the dial: ~0.3 is where body text starts to suffer */
    width: 46vw;
    max-width: 700px;
    aspect-ratio: 1;
    background-image: var(--backdrop-img);
    background-repeat: no-repeat;
    background-size: contain;
    background-position: center;
    -webkit-mask-image: radial-gradient(closest-side, #000 52%, transparent 100%);
    mask-image: radial-gradient(closest-side, #000 52%, transparent 100%);
  }

  .backdrop--tr { top: -6vh;  right: -8vw; }
  .backdrop--br { bottom: -8vh; right: -6vw; }
  .backdrop--bl { bottom: -6vh; left: -8vw; }
  .backdrop--tl { top: -8vh;  left: -6vw; }
  .backdrop--c  { top: 50%; left: 50%; transform: translate(-50%, -50%);
                  width: 74vw; max-width: 960px; opacity: 0.16; }

  /* keep the text above both decorative layers */
  #main,
  .masthead,
  .page__footer {
    position: relative;
    z-index: 1;
  }

  @media (max-width: 1200px) {
    .side-specimen { display: none; }
  }

  /* On phones a backdrop mostly gets in the way of reading */
  @media (max-width: 700px) {
    .backdrop { opacity: 0.15; }

    /* Wide figures lose their labels when squeezed into a phone column.
       Let them run edge to edge, and give the animation a minimum width it can
       be swiped across rather than shrinking its type into illegibility. */
    .page__content img.plain {
      width: 100vw;
      max-width: 100vw;
      margin-left: calc(50% - 50vw);
      margin-right: calc(50% - 50vw);
    }

    .figscroll {
      width: 100vw;
      margin-left: calc(50% - 50vw);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .figscroll img.schematic {
      width: 760px;          /* swipe across; labels stay readable */
      max-width: none;
      margin: 1em 0 0.4em;
    }

    .figscroll::after {
      content: "swipe to follow the sequence →";
      display: block;
      padding: 0 1.2em 0.4em;
      color: var(--global-text-color-light);
      font-size: 0.78em;
      font-style: italic;
    }
  }

  /* Title sitting over the hero band */
  .page__hero--overlay {
    height: 300px;
    display: flex;
    align-items: flex-end;
  }

  .page__hero--overlay .wrapper {
    padding-bottom: 0.4em;
  }

  .page__hero--overlay .page__title {
    color: #fff;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
    margin-bottom: 0;
  }

  @media (max-width: 600px) {
    .page__hero--overlay { height: 170px; }
  }

  /* ---- Compact lists (the "now / research / selected work" blocks) ---- */
  .page__content ul {
    margin-bottom: 1.2em;
  }

  .page__content ul li {
    margin-bottom: 0.45em;
  }

  /* ---- Figures ----
     The research figures have white backgrounds, which would otherwise sit on
     black as hard-edged bright rectangles. A soft border and inset padding
     make them read as plates rather than holes in the page. ---- */
  .page__content img {
    border-radius: 4px;
  }

  html[data-theme="dark"] .page__content p > img {
    background: #ffffff;
    padding: 0.6em;
    border: 1px solid var(--global-border-color);
  }

  /* Figures that already have a black background need no plate -- they should
     bleed straight into the page. Mark them <img class="plain" ...>. */
  html[data-theme="dark"] .page__content img.plain,
  html[data-theme="dark"] .page__content p > img.plain {
    background: none;
    padding: 0;
    border: none;
  }

  .page__content img.plain {
    display: block;
    width: 100%;
    height: auto;
    margin: 1.2em 0;
  }

  /* The animated schematic: full column width, its own aspect ratio reserved so the
     page doesn't jump while the 313 KB file loads. */
  .page__content img.schematic {
    aspect-ratio: 1200 / 760;
    margin: 1.4em 0 0.6em;
  }

  .page__content .figcaption {
    color: var(--global-text-color-light);
    font-size: 0.86em;
    line-height: 1.5;
    margin: 0 0 2.2em;
  }

  /* ---- Footer ---- */
  .page__footer {
    border-top: 1px solid var(--global-border-color);
    color: var(--global-text-color-light);
  }

  .page__footer footer {
    font-size: 0.8em;
  }

  .page__footer a {
    color: var(--global-link-color);
  }

  /* ---- Small screens ---- */
  @media (max-width: 600px) {
    .page__title { font-size: 1.7em; }
    .page__content p.tagline,
    .tagline { font-size: 1.45em; }
  }
</style>
