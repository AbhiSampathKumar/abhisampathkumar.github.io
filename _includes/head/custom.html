<!-- Custom head additions. AcademicPages includes this file inside <head>,
     so anything here overrides the theme's default styles. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<style>
  /* ---- Typography: serif headings, quiet sans body ---- */
  body,
  .page__content,
  .sidebar {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.65;
    color: #1f2328;
  }

  h1, h2, h3, h4, h5, h6,
  .page__title,
  .archive__item-title,
  .masthead__inner-wrap .site-title {
    font-family: "Newsreader", Georgia, serif;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: #111;
  }

  .page__title {
    font-size: 2.2em;
    margin-bottom: 0.4em;
  }

  /* Section headings get a hairline rule, like a printed page */
  .page__content h2 {
    font-size: 1.45em;
    margin-top: 2.2em;
    padding-bottom: 0.25em;
    border-bottom: 1px solid #e6e6e6;
  }

  .page__content h3 {
    font-size: 1.15em;
    margin-top: 1.8em;
  }

  /* ---- Links: understated, underline on hover ---- */
  a,
  .page__content a {
    color: #14507a;
    text-decoration: none;
    border-bottom: 1px solid rgba(20, 80, 122, 0.25);
  }

  a:hover,
  .page__content a:hover {
    color: #0d3a59;
    border-bottom-color: #0d3a59;
    text-decoration: none;
  }

  /* Don't underline structural links */
  .masthead a,
  .site-title,
  .author__urls a,
  .page__footer a,
  .toc a,
  .pagination a {
    border-bottom: none;
  }

  /* ---- Header ---- */
  .masthead {
    border-bottom: 1px solid #ececec;
  }

  .masthead__inner-wrap {
    padding: 0.9em 1em;
  }

  .greedy-nav .visible-links a::before {
    background: #14507a;
  }

  /* ---- Sidebar / author profile ---- */
  .author__avatar img {
    border-radius: 4px;
    border: 1px solid #eee;
    max-width: 180px;
  }

  .author__name {
    font-family: "Newsreader", Georgia, serif;
    font-size: 1.15em;
  }

  .author__bio {
    font-size: 0.85em;
    line-height: 1.5;
    color: #555;
  }

  .author__urls-wrapper li {
    font-size: 0.85em;
  }

  /* ---- Tagline on the home page ---- */
  .tagline {
    font-family: "Newsreader", Georgia, serif;
    font-style: italic;
    font-size: 1.25em;
    line-height: 1.45;
    color: #4a4a4a;
    margin: 0 0 1.5em;
    padding-left: 1em;
    border-left: 3px solid #e0e0e0;
  }

  /* ---- Compact lists (the "now / research / selected work" blocks) ---- */
  .page__content ul {
    margin-bottom: 1.2em;
  }

  .page__content ul li {
    margin-bottom: 0.45em;
  }

  /* ---- Figures ---- */
  .page__content img {
    border-radius: 4px;
  }

  /* ---- Footer ---- */
  .page__footer {
    background: #fafafa;
    border-top: 1px solid #ececec;
    color: #777;
  }

  .page__footer footer {
    font-size: 0.8em;
  }

  /* ---- Print / small screens ---- */
  @media (max-width: 600px) {
    .page__title { font-size: 1.7em; }
    .tagline { font-size: 1.1em; }
  }
</style>
