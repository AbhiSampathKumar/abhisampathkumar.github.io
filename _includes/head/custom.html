<!-- Custom head additions. AcademicPages includes this file inside <head> after
     main.css, so anything here overrides the theme's default styles. -->

<!-- Default the site to dark mode. Runs before first paint, so there's no
     white flash. The theme's toggle button (top right) still works and its
     choice is remembered in localStorage. -->
<script>document.documentElement.setAttribute("data-theme", "dark");</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<style>
  /* ---- True black palette ----
     The theme's own dark mode is a mid grey (#474747). These override its
     CSS variables to black. Same selector as the theme uses, declared later,
     so these win. Everything below reads from these variables, which means
     the light theme still works if a visitor flips the toggle. ---- */
  html[data-theme="dark"] {
    --global-bg-color: #000000;
    --global-footer-bg-color: #000000;
    --global-border-color: #262626;
    --global-dark-border-color: #333333;
    --global-code-background-color: #111111;
    --global-code-text-color: #e8e8e8;
    --global-fig-caption-color: #a8a8a8;
    --global-link-color: #62c7e3;
    --global-link-color-hover: #9adcef;
    --global-link-color-visited: #8ab6c4;
    --global-masthead-link-color: #ffffff;
    --global-masthead-link-color-hover: #62c7e3;
    --global-text-color: #ffffff;
    --global-text-color-light: #b5b5b5;
    --global-thead-color: #1a1a1a;
  }

  /* Belt and braces: some elements set their background from Sass rather than
     from the variables above. */
  html[data-theme="dark"],
  html[data-theme="dark"] body,
  html[data-theme="dark"] #main,
  html[data-theme="dark"] .page,
  html[data-theme="dark"] .masthead,
  html[data-theme="dark"] .page__footer,
  html[data-theme="dark"] .greedy-nav,
  html[data-theme="dark"] .greedy-nav .hidden-links {
    background-color: #000000;
  }

  /* ---- Typography: serif headings, quiet sans body ---- */
  body,
  .page__content,
  .sidebar {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.65;
    color: var(--global-text-color);
  }

  h1, h2, h3, h4, h5, h6,
  .page__title,
  .archive__item-title,
  .masthead__inner-wrap .site-title {
    font-family: "Newsreader", Georgia, serif;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--global-text-color);
  }

  .page__title {
    font-size: 2.2em;
    margin-bottom: 0.4em;
  }

  /* Section headings get a hairline rule, like a printed page */
  .page__content h2 {
    font-size: 1.45em;
    margin-top: 2.2em;
    padding-bottom: 0.25em;
    border-bottom: 1px solid var(--global-border-color);
  }

  .page__content h3 {
    font-size: 1.15em;
    margin-top: 1.8em;
  }

  /* ---- Links: understated, underline on hover ---- */
  a,
  .page__content a {
    color: var(--global-link-color);
    text-decoration: none;
    border-bottom: 1px solid rgba(98, 199, 227, 0.3);
  }

  a:hover,
  .page__content a:hover {
    color: var(--global-link-color-hover);
    border-bottom-color: currentColor;
    text-decoration: none;
  }

  /* Don't underline structural links */
  .masthead a,
  .site-title,
  .author__urls a,
  .page__footer a,
  .toc a,
  .pagination a {
    border-bottom: none;
  }

  /* ---- Header ---- */
  .masthead {
    border-bottom: 1px solid var(--global-border-color);
  }

  .masthead__inner-wrap {
    padding: 0.9em 1em;
  }

  .greedy-nav .visible-links a::before {
    background: var(--global-link-color);
  }

  /* ---- Sidebar / author profile ---- */
  .author__avatar img {
    border-radius: 4px;
    border: 1px solid var(--global-border-color);
    max-width: 180px;
  }

  .author__name {
    font-family: "Newsreader", Georgia, serif;
    font-size: 1.15em;
  }

  .author__bio {
    font-size: 0.85em;
    line-height: 1.5;
    color: var(--global-text-color-light);
  }

  .author__urls-wrapper li {
    font-size: 0.85em;
  }

  /* ---- Tagline: the lead line on the home page, in place of an h1 ----
     The two-part selector is deliberate. The theme sets font-size 1em on
     .page__content p, which is more specific than .tagline alone and would
     otherwise win no matter what size is set here. ---- */
  .page__content p.tagline,
  .tagline {
    font-family: "Newsreader", Georgia, serif;
    font-style: italic;
    font-size: 2em;        /* ~32px against the 16px body */
    line-height: 1.2;
    color: var(--global-text-color);
    margin: 0.15em 0 1.1em;
    padding-left: 0;
    border-left: none;
  }

  /* ==========================================================================
     MICROSCOPY BANDS
     Two ways in, styled identically:
       1. Pages with a title use the theme's hero -- set header.overlay_image
          in the front matter and the title renders over the image.
       2. The home page has no title, so it uses <div class="band"> in the
          markdown instead, with the file passed via the --band-img variable.
     Both fade to black at the bottom and at the left/right edges, so a
     black-background micrograph dissolves into the page rather than sitting
     in a rectangle. Drop the fade by deleting the mask-image lines.
     ========================================================================== */

  .band,
  .page__hero--overlay {
    min-height: 0;
    padding: 0;
    margin: 0 0 1.8em;
    background-color: #000;
    /* `contain`, not `cover`: the band images are montages of whole specimens,
       so nothing may be cropped. Any leftover space is black, which is the
       page colour anyway, so the letterboxing is invisible. */
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    /* fade out at the bottom and both sides */
    -webkit-mask-image:
      linear-gradient(to bottom, #000 45%, transparent 100%),
      linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to bottom, #000 45%, transparent 100%),
      linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%);
    mask-composite: intersect;
  }

  .band {
    background-image: var(--band-img);
    /* height follows the column width at the montage's own aspect ratio,
       so the specimens are never squeezed or clipped */
    aspect-ratio: 1800 / 560;
  }

  /* Divider version between sections */
  .band--strip {
    margin: 2.6em 0 2.2em;
  }

  /* Title sitting over the hero band */
  .page__hero--overlay {
    height: 300px;
    display: flex;
    align-items: flex-end;
  }

  .page__hero--overlay .wrapper {
    padding-bottom: 0.4em;
  }

  .page__hero--overlay .page__title {
    color: #fff;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
    margin-bottom: 0;
  }

  @media (max-width: 600px) {
    .page__hero--overlay { height: 170px; }
  }

  /* ---- Compact lists (the "now / research / selected work" blocks) ---- */
  .page__content ul {
    margin-bottom: 1.2em;
  }

  .page__content ul li {
    margin-bottom: 0.45em;
  }

  /* ---- Figures ----
     The research figures have white backgrounds, which would otherwise sit on
     black as hard-edged bright rectangles. A soft border and inset padding
     make them read as plates rather than holes in the page. ---- */
  .page__content img {
    border-radius: 4px;
  }

  html[data-theme="dark"] .page__content p > img {
    background: #ffffff;
    padding: 0.6em;
    border: 1px solid var(--global-border-color);
  }

  /* ---- Footer ---- */
  .page__footer {
    border-top: 1px solid var(--global-border-color);
    color: var(--global-text-color-light);
  }

  .page__footer footer {
    font-size: 0.8em;
  }

  .page__footer a {
    color: var(--global-link-color);
  }

  /* ---- Small screens ---- */
  @media (max-width: 600px) {
    .page__title { font-size: 1.7em; }
    .page__content p.tagline,
    .tagline { font-size: 1.45em; }
  }
</style>
